<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Century Auto Sales Admin</title><link rel="stylesheet" href="style.css"></head><body class="admin"><div id="login" class="login"><h1>Century Auto Sales</h1><h2>Dealer Admin</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="primary">Sign In</button></form><p id="loginError"></p></div><div id="dash" class="hidden"><header><b>Century Auto Sales — Admin</b><button id="logout">Log Out</button></header><main><div class="stats"><div><b id="openCount">0</b><small>Open Requests</small></div><div><b id="totalCount">0</b><small>Total Requests</small></div></div><h2>Request to Chat</h2><p>Customer requests from the website appear here. This is separate from Smartsupp Live Chat.</p><div id="requests"></div><div id="conversation"></div></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,collection,query,orderBy,getDocs,doc,getDoc,updateDoc,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
loginForm.onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,email.value,password.value);loginError.textContent=""}catch(x){loginError.textContent="Login failed. Check Firebase Authentication."}};
onAuthStateChanged(auth,u=>{if(u){login.classList.add("hidden");dash.classList.remove("hidden");load()}else{dash.classList.add("hidden");login.classList.remove("hidden")}});
logout.onclick=()=>signOut(auth);
async function load(){try{const s=await getDocs(query(collection(db,"chatRequests"),orderBy("createdAt","desc")));const a=s.docs.map(d=>({id:d.id,...d.data()}));openCount.textContent=a.filter(x=>x.status==="open").length;totalCount.textContent=a.length;requests.innerHTML=a.length?a.map(x=>`<article class="request" data-id="${x.id}"><b>${safe(x.name)}</b><span>${x.status}</span><p>${safe(x.vehicle||"General inquiry")}</p><p>${safe(x.message)}</p><small>${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString():"New"}</small></article>`).join(""):"<p>No requests yet.</p>";document.querySelectorAll(".request").forEach(x=>x.onclick=()=>open(x.dataset.id))}catch(e){requests.innerHTML="<p>Could not load requests. Check Firestore rules.</p>"}}
async function open(id){const s=await getDoc(doc(db,"chatRequests",id));if(!s.exists())return;const x={id:s.id,...s.data()};conversation.innerHTML=`<div class="conv"><h2>${safe(x.name)}</h2><p>${safe(x.email)} ${x.phone?"• "+safe(x.phone):""}</p><p><b>Vehicle:</b> ${safe(x.vehicle||"Not specified")}</p><div id="msgs" class="messages">${(x.messages||[{sender:"customer",text:x.message}]).map(m=>`<div class="msg ${m.sender==="agent"?"agent":""}"><b>${m.sender==="agent"?"You":"Customer"}</b><p>${safe(m.text)}</p></div>`).join("")}</div><form id="reply"><input id="replyText" placeholder="Reply to customer..." required><button class="primary">Reply</button></form><button id="close" class="secondary">Close Request</button></div>`;reply.onsubmit=async e=>{e.preventDefault();const text=replyText.value.trim();if(!text)return;await updateDoc(doc(db,"chatRequests",id),{messages:arrayUnion({sender:"agent",text,createdAt:new Date().toISOString()}),updatedAt:serverTimestamp()});replyText.value="";open(id)};close.onclick=async()=>{await updateDoc(doc(db,"chatRequests",id),{status:"closed",updatedAt:serverTimestamp()});conversation.innerHTML="";load()}}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]))}
setInterval(()=>{if(auth.currentUser)load()},5000);
</script></body></html>
