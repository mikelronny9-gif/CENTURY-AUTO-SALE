<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dealer Admin</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-page">
<div id="login" class="login-card"><div class="brand"><span class="brand-mark">D</span><span>Century Auto Sales <b>Admin</b></span></div><h1>Dealer login</h1><p>Sign in to view chat requests and manage inventory.</p><form onsubmit="login(event)"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="btn" type="submit">Sign In</button><p id="loginError" class="error"></p></form></div>
<div id="dashboard" class="dashboard hidden"><header class="admin-head"><div><p class="eyebrow">DEALER DASHBOARD</p><h1>Welcome back</h1></div><button class="outline" onclick="logout()">Log out</button></header>
<div class="stats"><div><small>CHAT REQUESTS</small><b id="leadCount">0</b></div><div><small>LIVE CHAT</small><b>Online</b></div><div><small>INVENTORY</small><b id="carCount">0</b></div></div>
<section class="admin-section"><div class="section-head"><h2>Live Chat Inbox</h2><button class="outline" onclick="clearChats()">Clear chats</button></div><div id="chatInbox"></div></section><section class="admin-section"><div class="section-head"><h2>Customer requests</h2><button class="outline" onclick="clearLeads()">Clear requests</button></div><div id="leads"></div></section>
<section class="admin-section"><div class="section-head"><h2>Inventory</h2><button class="btn" onclick="addCar()">Add vehicle</button></div><div id="adminCars"></div></section>
</div><script src="app.js"></script><script>initAdmin()</script></body></html>
